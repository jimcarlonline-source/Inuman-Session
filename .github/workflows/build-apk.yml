name: Build Android APK

# Runs on every push to main, on version tags (v1.0.0 etc.), and from the Actions tab.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Find the game folder
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CFG" ]; then echo "capacitor.config.json not found. Upload all the project files."; exit 1; fi
          echo "APP_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "Game folder: $(dirname "$CFG")"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu machines already include the Android SDK; just accept its licenses.
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Android SDK: $SDK"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install packages
        run: |
          cd "$APP_DIR"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Create the Android project
        run: |
          cd "$APP_DIR"
          if [ ! -d android ]; then npx cap add android; fi

      - name: App icon and splash screen
        run: |
          cd "$APP_DIR"
          npm run android:icons || echo "Icon step skipped"

      - name: Lock the game to portrait
        run: |
          MANIFEST="$APP_DIR/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'screenOrientation' "$MANIFEST"; then
            sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="portrait"/' "$MANIFEST"
          fi

      - name: Set the version number
        run: |
          GRADLE="$APP_DIR/android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"

      - name: Copy the game into the app
        run: |
          cd "$APP_DIR"
          npx cap sync android

      - name: Build the APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" "out/InumanSession-1.0.${{ github.run_number }}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: InumanSession-APK
          path: out/*.apk

      - name: Attach the APK to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
